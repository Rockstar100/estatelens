# Default: web app talks to MongoDB Atlas via MONGODB_URI in .env
# (same cloud cluster the CLI uses).
#
# Optional leftover local Mongo (only if you explicitly want it):
#   docker compose --profile local-mongo up -d mongo

services:
  mongo:
    profiles: ["local-mongo"]
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - estatelens_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

volumes:
  estatelens_mongo:
